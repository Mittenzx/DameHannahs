name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - 'Mews2026/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markdown-to-pdf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Install Pandoc and wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf xvfb
      
      - name: Create PDF output directory
        run: mkdir -p Mews2026/PDF_Exports
      
      - name: Convert Markdown files to PDF
        run: |
          for file in Mews2026/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .md)
              echo "Converting: $file"
              xvfb-run -a pandoc "$file" -o "Mews2026/PDF_Exports/${filename}.pdf" \
                --from markdown \
                --to pdf \
                --pdf-engine=wkhtmltopdf \
                --variable fontsize=11pt \
                --variable geometry:margin=1in \
                --toc \
                --number-sections \
                2>&1 || echo "Conversion completed with warnings"
              echo "✅ Converted: $file → Mews2026/PDF_Exports/${filename}.pdf"
            fi
          done
          
          echo "Generated PDFs:"
          ls -lh Mews2026/PDF_Exports/
      
      - name: Commit and push PDF files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A Mews2026/PDF_Exports/
          
          if git diff --cached --quiet; then
            echo "ℹ️ No new PDFs to commit"
          else
            git commit -m "Auto-generate PDF exports from Markdown files [skip ci]"
            git push origin main
            echo "✅ PDFs committed and pushed successfully"
          fi
